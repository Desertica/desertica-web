name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No attribution trailers or bot authors
        run: |
          range="origin/${{ github.base_ref }}..HEAD"
          if git log --format=%B "$range" | grep -i -E '^(co-authored-by|claude-session):|generated with \[claude' ; then
            echo "::error::Remove Co-Authored-By / Claude trailers from commit messages"; exit 1
          fi
          if git log --format='%ae %ce' "$range" | grep -i 'anthropic.com'; then
            echo "::error::Commits must be authored by a person"; exit 1
          fi
      - name: Branch name
        run: |
          case "${{ github.head_ref }}" in
            claude/*) echo "::error::Branch names must not start with claude/"; exit 1;;
          esac

  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npx ng test --watch=false
      - name: Production build (browser bundle + SSR server)
        run: npm run build
