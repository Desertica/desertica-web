name: Lighthouse (production)

# Informational only: do not add it to the required checks. Set the repo variable PROD_URL
# (Settings -> Secrets and variables -> Actions -> Variables), e.g. https://desertica.pe
on:
  workflow_dispatch:
  schedule:
    - cron: '41 6 * * 1'

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROD_URL: ${{ vars.PROD_URL }}
    steps:
      - name: Skip when PROD_URL is empty
        if: env.PROD_URL == ''
        run: echo "PROD_URL is not set, nothing to audit."
      - uses: actions/checkout@v4
        if: env.PROD_URL != ''
      - name: Lighthouse CI
        if: env.PROD_URL != ''
        run: |
          npx --yes @lhci/cli@0.15.1 autorun \
            --collect.url="$PROD_URL/en/" --collect.numberOfRuns=3 \
            --assert.assertions.categories:performance="warn:minScore=0.8" \
            --assert.assertions.categories:accessibility="warn:minScore=0.9" \
            --assert.assertions.categories:seo="warn:minScore=0.9" \
            --assert.assertions.categories:best-practices="warn:minScore=0.9" \
            --upload.target=temporary-public-storage
