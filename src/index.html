<!doctype html>
<html lang="en" data-intro="done">
  <head>
    <meta charset="utf-8" />
    <title>Desértica | Tours and experiences in Ica</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Book dune buggies, vineyard sunsets, oasis camps, and sunrise walks in Ica and Huacachina."
    />
    <link rel="icon" type="image/svg+xml" href="/brand/mark-on-olive.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Placeholder families: swap with --font-sans / --font-heading in styles.css. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;

          var locale = localStorage.getItem('locale');
          if (locale !== 'en' && locale !== 'es') {
            var match = document.cookie.match(/(?:^|; )locale=(en|es)(?:;|$)/);
            locale = match ? match[1] : null;
          }
          if (locale === 'en' || locale === 'es') {
            document.documentElement.lang = locale;
          }

          var intro = 'done';
          try {
            if (
              !window.matchMedia('(prefers-reduced-motion: reduce)').matches &&
              sessionStorage.getItem('desertica-intro') !== '1'
            ) {
              intro = 'pending';
            }
          } catch (err) {}
          document.documentElement.dataset.intro = intro;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
