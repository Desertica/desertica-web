<a
  href="#main-content"
  class="bg-primary text-primary-foreground focus:ring-ring sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:rounded-3xl focus:px-3 focus:py-2 focus:ring-2"
  [inert]="intro.showOverlay()"
>
  {{ 'skip' | translate: i18n.locale() }}
</a>
<app-site-header [inert]="intro.showOverlay()" />
<div id="smooth-wrapper" [inert]="intro.showOverlay()">
  <div id="smooth-content">
    <main id="main-content" class="flex-1">
      <router-outlet />
    </main>
    <app-site-footer />
  </div>
</div>
<app-whatsapp-fab [inert]="intro.showOverlay()"></app-whatsapp-fab>
<app-cookie-banner [inert]="intro.showOverlay()" />
<hlm-toaster [theme]="theme()" [inert]="intro.showOverlay()" />
@if (intro.showOverlay()) {
  <app-intro-overlay />
}
