name: CI

on:
  pull_request:
    branches: [develop, staging, prod]
  push:
    branches: [develop, staging, prod]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx ng test --watch=false
      - name: Production build (browser bundle + SSR server)
        run: npm run build
      - name: Smoke test the built server
        run: |
          PORT=4000 node dist/desertica-web/server/server.mjs > server.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:4000/ && break; sleep 1; done
          # no /health route: "/" must redirect to a locale and that page must render
          loc=$(curl -s -o /dev/null -w '%{redirect_url}' http://localhost:4000/)
          case "$loc" in http://localhost:4000/en/*|http://localhost:4000/es/*) ;; *) cat server.log; echo "::error::/ did not redirect to /en/ or /es/"; exit 1;; esac
          code=$(curl -s -o /dev/null -w '%{http_code}' "$loc")
          [ "$code" = 200 ] || { cat server.log; echo "::error::$loc returned $code"; exit 1; }

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: The image builds
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

