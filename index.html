<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Desértica | Tours and experiences in Ica</title>
  <meta name="description" content="Desértica | Tours and experiences in Ica" />
  <link rel="icon" href="logo.png" type="image/png" />
  <style>
    :root {
      --olive: #5a6b3e;
      --sand: #f9f6f0;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      background: var(--olive);
      color: var(--sand);
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }

    .stage {
      width: min(72vw, 420px);
      cursor: pointer;
    }

    .stage img {
      display: block;
      width: 100%;
      height: auto;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .hint {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      margin: 0;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.55;
      user-select: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <h1 class="sr-only">Desértica | Tours and experiences in Ica</h1>
  <div class="stage" id="stage" title="Click to replay">
    <img id="logo" src="logo.png" alt="Desértica" width="320" height="320" />
  </div>
  <p class="hint">Click to replay</p>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script>
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const logo = document.getElementById("logo");

    function play() {
      if (reduced || typeof gsap === "undefined") {
        gsap && gsap.set(logo, { autoAlpha: 1, scale: 1 });
        return;
      }

      return gsap.fromTo(
        logo,
        { autoAlpha: 0, scale: 0.92 },
        { autoAlpha: 1, scale: 1, duration: 1.15, ease: "power2.out" }
      );
    }

    let current = play();

    document.getElementById("stage").addEventListener("click", () => {
      if (reduced) return;
      if (current) current.kill();
      current = play();
    });
  </script>
</body>
</html>
